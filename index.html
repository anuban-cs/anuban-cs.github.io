<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ระบบห้องสมุด อนุบาลชุมแสง</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
      body { font-family: 'Sarabun', sans-serif; background-color: #f4f6f9; padding-bottom: 50px; }
      .app-header { background: linear-gradient(135deg, #6f42c1, #5a32a3); color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; margin-bottom: 20px; }
      .container { max-width: 500px; }
      .nav-pills .nav-link.active { background-color: #ffc107; color: #000; font-weight: bold; border-radius: 20px;}
      .nav-pills .nav-link { color: #5a32a3; border-radius: 20px; font-weight: 600;}
      .card { border-radius: 15px; border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
      .btn-purple { background-color: #6f42c1; color: white; border: none;}
      #reader-borrow, #reader-add { width: 100%; display: none; margin-bottom: 15px; border-radius: 10px; border: 2px solid #6f42c1; background: #000;}
      .book-img { width: 60px; height: 85px; object-fit: cover; border-radius: 5px; background-color: #e9ecef; }
    </style>
  </head>
  <body>

    <div class="app-header">
      <h3 class="mb-0 fw-bold">📚 ห้องสมุดโรงเรียน</h3>
      <p class="mb-0">อนุบาลชุมแสง (วัดทับกฤชกลาง)</p>
    </div>

    <div class="container">
      <ul class="nav nav-pills mb-4 justify-content-center nav-fill gap-2" id="pills-tab" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-search" type="button">🔍 ค้นหา</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-borrow" type="button">🔄 ยืม-คืน</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-add" type="button">➕ ลงทะเบียน</button></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-search">
          <div class="card p-4">
             <div class="input-group mb-3">
               <input type="text" id="searchInput" class="form-control" placeholder="พิมพ์ชื่อหนังสือ หรือ ISBN...">
               <button onclick="searchBooks()" class="btn btn-warning fw-bold">ค้นหา</button>
             </div>
             <div id="searchResult" class="list-group list-group-flush mt-2"></div>
          </div>
        </div>

        <div class="tab-pane fade" id="tab-borrow">
          <div class="card p-4">
            <div id="reader-borrow"></div>
            <div class="mb-3"><input type="number" id="studentId" class="form-control form-control-lg" placeholder="ระบุรหัสนักเรียน"></div>
            <div class="mb-4">
               <div class="input-group">
                 <input type="text" id="isbnBorrow" class="form-control form-control-lg" placeholder="สแกนหรือพิมพ์ ISBN">
                 <button class="btn btn-purple" type="button" onclick="toggleScanner('isbnBorrow', 'reader-borrow')">📷 สแกน</button>
               </div>
            </div>
            <div class="d-flex gap-2">
              <button onclick="processTransaction('borrowBook')" class="btn btn-success flex-fill py-2 fw-bold">ยืม</button>
              <button onclick="processTransaction('returnBook')" class="btn btn-secondary flex-fill py-2 fw-bold">คืน</button>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="tab-add">
          <div class="card p-4">
            <div id="reader-add"></div>
            <form id="addBookForm" onsubmit="submitBook(event)">
              <div class="mb-3">
                <div class="input-group">
                  <input type="text" id="isbnAdd" name="isbn" class="form-control" placeholder="ISBN (สแกนเพื่อดึงข้อมูล)" required onchange="fetchBookInfo()">
                  <button class="btn btn-purple" type="button" onclick="toggleScanner('isbnAdd', 'reader-add')">📷 สแกน</button>
                </div>
                <small id="loadingText" class="text-primary mt-1" style="display:none;">กำลังค้นหาออนไลน์...</small>
              </div>
              <div class="mb-2"><input type="text" id="bookName" name="bookName" class="form-control" placeholder="ชื่อหนังสือ" required></div>
              <div class="row g-2 mb-2">
                <div class="col"><input type="text" id="author" name="author" class="form-control" placeholder="ผู้แต่ง"></div>
                <div class="col"><input type="text" name="category" class="form-control" placeholder="หมวดหมู่"></div>
              </div>
              <div class="row g-2 mb-3">
                 <div class="col-4"><input type="number" name="qty" class="form-control" placeholder="จำนวน" required value="1" min="1"></div>
                 <div class="col-8"><input type="text" id="imgUrl" name="imgUrl" class="form-control" placeholder="URL รูปปก"></div>
              </div>
              <div class="text-center mb-3"><img id="previewCover" src="" class="book-img" style="display:none; width: 100px; height: auto;"></div>
              <button type="submit" class="btn btn-warning w-100 py-2 fw-bold">บันทึก</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // ==========================================
      // เอา URL ของ Google Apps Script มาวางในเครื่องหมายคำพูดด้านล่างนี้ครับ
      // ==========================================
      const API_URL = "https://script.google.com/macros/s/AKfycbyAXwZxaD40RBuM_Wbpsmq4HnzHxdAGya_V74PQyGoqhLt7uKgwlM8VZkaUw4W58LPXjg/exec"; 

      // ฟังก์ชันสำหรับส่งข้อมูลไปหา Google Sheet
      async function callAPI(action, data) {
        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // กัน CORS Error
            body: JSON.stringify({ action: action, ...data })
          });
          return await response.json();
        } catch (error) {
          console.error(error);
          Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', 'error');
          return null;
        }
      }

      window.onload = () => searchBooks();

      async function searchBooks() {
        let keyword = document.getElementById('searchInput').value;
        document.getElementById('searchResult').innerHTML = '<div class="text-center mt-3"><div class="spinner-border text-primary"></div></div>';
        
        const res = await callAPI('searchBooks', { keyword: keyword });
        if(res && res.status) {
            let html = "";
            if(res.data.length === 0) html = "<p class='text-center mt-3'>ไม่พบข้อมูล</p>";
            res.data.forEach(row => {
              let badge = row[5] > 0 ? `<span class="badge bg-success">ว่าง ${row[5]}</span>` : `<span class="badge bg-danger">หมด</span>`;
              let img = row[6] ? `<img src="${row[6]}" class="book-img">` : `<div class="book-img d-flex align-items-center justify-content-center text-muted small">ไม่มีรูป</div>`;
              html += `<div class="list-group-item d-flex align-items-center px-0 py-3 border-bottom"><div class="me-3">${img}</div><div class="flex-grow-1"><h6 class="fw-bold mb-1">${row[1]}</h6><div class="text-muted small">ISBN: ${row[0]}</div></div><div>${badge}</div></div>`;
            });
            document.getElementById('searchResult').innerHTML = html;
        }
      }

      async function processTransaction(actionStr) {
        let sid = document.getElementById('studentId').value;
        let isbn = document.getElementById('isbnBorrow').value;
        if(!sid || !isbn) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาระบุรหัสนักเรียนและ ISBN', 'warning');
        
        Swal.fire({title: 'กำลังประมวลผล...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
        const res = await callAPI(actionStr, { studentId: sid, isbn: isbn });
        
        if(res) {
          if(res.status) { Swal.fire('สำเร็จ', res.msg, 'success'); document.getElementById('isbnBorrow').value = ''; searchBooks(); } 
          else { Swal.fire('ผิดพลาด', res.msg, 'error'); }
        }
      }

      async function submitBook(e) {
        e.preventDefault();
        Swal.fire({title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
        const formData = new FormData(document.getElementById("addBookForm"));
        const formObject = Object.fromEntries(formData.entries());
        
        const res = await callAPI('addNewBook', { formObject: formObject });
        if(res && res.status) {
           Swal.fire('เรียบร้อย', res.msg, 'success');
           document.getElementById("addBookForm").reset();
           document.getElementById('previewCover').style.display = 'none';
           searchBooks();
        }
      }

      function fetchBookInfo() {
        const isbn = document.getElementById('isbnAdd').value.trim();
        if(isbn.length < 10) return;
        document.getElementById('loadingText').style.display = 'block';
        fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${isbn}`).then(res => res.json()).then(data => {
             document.getElementById('loadingText').style.display = 'none';
             if(data.totalItems > 0) {
               let book = data.items[0].volumeInfo;
               document.getElementById('bookName').value = book.title || "";
               document.getElementById('author').value = (book.authors) ? book.authors.join(", ") : "";
               if(book.imageLinks && book.imageLinks.thumbnail) {
                 document.getElementById('imgUrl').value = book.imageLinks.thumbnail.replace("http://", "https://");
                 document.getElementById('previewCover').src = document.getElementById('imgUrl').value;
                 document.getElementById('previewCover').style.display = 'block';
               }
             }
        });
      }

      // ระบบกล้อง
      let html5QrCode = null; let currentReaderId = null;
      function toggleScanner(inputId, readerId) {
        if (html5QrCode && html5QrCode.isScanning && currentReaderId === readerId) { stopScan(); } else { startScan(inputId, readerId); }
      }
      function startScan(inputId, readerId) {
        if (html5QrCode && html5QrCode.isScanning) stopScan();
        document.getElementById(readerId).style.display = 'block';
        html5QrCode = new Html5Qrcode(readerId);
        currentReaderId = readerId;
        const onScanSuccess = (decodedText) => {
            document.getElementById(inputId).value = decodedText;
            if (window.navigator.vibrate) window.navigator.vibrate(200);
            stopScan();
            if(inputId === 'isbnAdd') fetchBookInfo(); 
        };
        html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 100 } }, onScanSuccess, ()=>{})
          .catch(() => {
            html5QrCode.start({ facingMode: "user" }, { fps: 10, qrbox: { width: 250, height: 100 } }, onScanSuccess, ()=>{})
            .catch(()=> { document.getElementById(readerId).style.display = 'none'; Swal.fire('ผิดพลาด', 'ไม่สามารถเปิดกล้องได้', 'error'); });
          });
      }
      function stopScan() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => { html5QrCode.clear(); if(currentReaderId){ document.getElementById(currentReaderId).style.display = 'none'; currentReaderId = null; } });
        }
      }
    </script>
  </body>
</html>
